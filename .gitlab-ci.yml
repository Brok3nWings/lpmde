stages:
  - install
  - test
  - release
  - staging
  - production

variables:
  DOCKER_DRIVER: overlay2

.php-setup: &php-setup
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libpq-dev libsqlite3-dev
    - docker-php-ext-install pdo pdo_pgsql pdo_sqlite
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

# -----------------------------------------
# Stage: Install
# -----------------------------------------
install:
  stage: install
  image: php:8.2-cli
  <<: *php-setup
  script:
    - |
      echo "APP_ENV=test" > .env
      echo "APP_SECRET=test_secret_for_ci_only" >> .env
      echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/
  artifacts:
    paths:
      - vendor/
    expire_in: 1 day

# -----------------------------------------
# Stage: Test
# -----------------------------------------
sast-npm-audit:
  stage: test
  image: node:18
  needs: [install]
  script:
    - npm audit --audit-level=moderate || true
  allow_failure: true

trivy-fs-audit:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [install]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 .
  allow_failure: true

unit-test:
  stage: test
  image: php:8.2-cli
  needs: [install]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libpq-dev
    - docker-php-ext-install pdo pdo_pgsql
    - pecl install pcov && docker-php-ext-enable pcov
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - |
      echo "APP_ENV=test" > .env
      echo "APP_SECRET=test_secret_for_ci_only" >> .env
      echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env
    - mkdir -p var/log
    - php bin/phpunit --coverage-cobertura=var/log/cobertura.xml --log-junit=var/log/junit.xml --coverage-text | tee var/log/coverage-summary.txt
    - grep -E "Classes|Methods|Lines" var/log/coverage-summary.txt || true
  artifacts:
    when: always
    reports:
      junit: var/log/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: var/log/cobertura.xml
    paths:
      - var/log/junit.xml
      - var/log/cobertura.xml
    expire_in: 1 day

e2e-test:
  stage: test
  image: php:8.2-cli
  needs: [install]
  <<: *php-setup
  script:
    - |
      echo "APP_ENV=test" > .env
      echo "APP_SECRET=test_secret_for_ci_only" >> .env
      echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env
    - echo "Running E2E tests"
    - php bin/phpunit --testsuite=e2e --no-coverage

sonar-audit:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs: [unit-test]
  script:
    - >
      sonar-scanner
      -Dsonar.projectKey=${CI_PROJECT_NAME}
      -Dsonar.organization=${SONAR_ORGANIZATION}
      -Dsonar.sources=src
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.php.coverage.reportPaths=var/log/cobertura.xml
      -Dsonar.token=${SONAR_TOKEN}
  allow_failure: true

# -----------------------------------------
# Stage: Release
# -----------------------------------------
k6-smoke-test:
  stage: release
  image: php:8.2-cli
  needs: [unit-test, e2e-test]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip libsqlite3-dev curl
    - docker-php-ext-install pdo pdo_sqlite
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - curl -L https://github.com/grafana/k6/releases/download/v0.56.0/k6-v0.56.0-linux-amd64.tar.gz -o /tmp/k6.tar.gz
    - tar -xzf /tmp/k6.tar.gz -C /tmp && mv /tmp/k6-v0.56.0-linux-amd64/k6 /usr/local/bin/k6
  script:
    - |
      echo "APP_ENV=dev" > .env
      echo "APP_SECRET=test_secret_for_ci_only" >> .env
      echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/test.db" >> .env
      echo "USER_SERVICE_URL=http://localhost:8001" >> .env
      echo "SUBSCRIPTION_SERVICE_URL=http://localhost:8001" >> .env
      echo "MESSENGER_TRANSPORT_DSN=sync://" >> .env
    - php -S localhost:8000 -t public &
    - php -S localhost:8001 -t public &
    - sleep 3
    - curl -sf http://localhost:8000/ > /dev/null && echo "Server 8000 OK"
    - curl -sf http://localhost:8001/ > /dev/null && echo "Server 8001 OK"
    - mkdir -p var/log
    - k6 run load-tests/smoke-test.js --out json=var/log/k6-results.json
  artifacts:
    when: always
    paths:
      - var/log/k6-results.json
    expire_in: 1 day
  allow_failure: true

build-image:
  stage: release
  tags:
    - self-hosted
  needs: [unit-test, e2e-test, k6-smoke-test]
  script:
    - docker build -t lpmde:latest .

trivy-image-scan:
  stage: release
  tags:
    - self-hosted
  needs: [build-image]
  script:
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL --exit-code 0 lpmde:latest
  allow_failure: true

# -----------------------------------------
# Stage: Staging  (runner Windows self-hosted - PowerShell)
# -----------------------------------------
deploy-staging:
  stage: staging
  tags:
    - self-hosted
  needs: [trivy-image-scan]
  environment:
    name: staging
    url: http://localhost:8089
  script:
    - docker network inspect lpmde-net 2>&1 | Out-Null; if ($LASTEXITCODE -ne 0) { docker network create lpmde-net }; Write-Host "Network ready"
    - |
      $ErrorActionPreference = 'SilentlyContinue'
      $running = docker inspect --format "{{.State.Running}}" lpmde_db_prod 2>&1
      if ($running -ne "true") {
        Write-Host "Demarrage du conteneur PostgreSQL..."
        docker rm lpmde_db_prod 2>&1 | Out-Null
        docker run -d `
          --restart=unless-stopped `
          --network lpmde-net `
          --name lpmde_db_prod `
          -e POSTGRES_DB=app_db `
          -e POSTGRES_USER=app_user `
          -e POSTGRES_PASSWORD=app_password `
          -v lpmde_pg_data:/var/lib/postgresql/data `
          postgres:16-alpine
        if ($LASTEXITCODE -ne 0) { Write-Error "docker run failed"; exit 1 }
        Start-Sleep -Seconds 10
      } else {
        Write-Host "PostgreSQL deja en cours d'execution"
        $nets = docker inspect --format "{{json .NetworkSettings.Networks}}" lpmde_db_prod 2>&1
        if ($nets -notmatch "lpmde-net") { docker network connect lpmde-net lpmde_db_prod }
      }
    - docker stop lpmde_staging; docker rm lpmde_staging
    - |
      docker run -d `
        --restart=unless-stopped `
        --network lpmde-net `
        -p 8089:80 `
        -e APP_ENV=prod `
        -e APP_SECRET=$env:APP_SECRET `
        -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
        --name lpmde_staging `
        lpmde:latest
    - |
      Start-Sleep -Seconds 5
      docker exec `
        -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
        lpmde_staging `
        bash -c "cd /var/www/html && php bin/console doctrine:migrations:migrate --no-interaction"
    - docker exec lpmde_staging php bin/console app:db:seed --no-interaction; Write-Host "Seed termine"
    - |
      docker exec lpmde_staging chown -R www-data:www-data /var/www/html/var
      docker exec -u www-data `
        -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
        lpmde_staging `
        php bin/console cache:warmup --env=prod
    - |
      $maxAttempts = 12; $attempt = 0
      do {
        $attempt++
        Start-Sleep -Seconds 5
        try {
          $response = Invoke-WebRequest -Uri http://localhost:8089/healthy -UseBasicParsing -ErrorAction Stop
          Write-Host "Staging OK - HTTP $($response.StatusCode)"; exit 0
        } catch {
          $statusCode = if ($_.Exception.Response) { $_.Exception.Response.StatusCode.value__ } else { "connexion refusee" }
          Write-Host "Tentative $attempt/$maxAttempts - $statusCode - $($_.Exception.Message)"
        }
      } while ($attempt -lt $maxAttempts)
      docker logs --tail 50 lpmde_staging
      docker inspect --format "Statut: {{.State.Status}} | Erreur: {{.State.Error}}" lpmde_staging
      Write-Host "Health check echoue apres $maxAttempts tentatives"; exit 1

# -----------------------------------------
# Stage: Production  (runner Windows self-hosted - PowerShell)
# -----------------------------------------
deploy-production:
  stage: production
  tags:
    - self-hosted
  needs: [deploy-staging]
  when: manual
  environment:
    name: production
    url: http://localhost:8088
  script:
    - docker network inspect lpmde-net 2>&1 | Out-Null; if ($LASTEXITCODE -ne 0) { docker network create lpmde-net }; Write-Host "Network ready"
    - |
      $ErrorActionPreference = 'SilentlyContinue'
      $running = docker inspect --format "{{.State.Running}}" lpmde_db_prod 2>&1
      if ($running -ne "true") {
        Write-Host "Demarrage du conteneur PostgreSQL..."
        docker rm lpmde_db_prod 2>&1 | Out-Null
        docker run -d `
          --restart=unless-stopped `
          --network lpmde-net `
          --name lpmde_db_prod `
          -e POSTGRES_DB=app_db `
          -e POSTGRES_USER=app_user `
          -e POSTGRES_PASSWORD=app_password `
          -v lpmde_pg_data:/var/lib/postgresql/data `
          postgres:16-alpine
        if ($LASTEXITCODE -ne 0) { Write-Error "docker run failed"; exit 1 }
        Start-Sleep -Seconds 10
      } else {
        Write-Host "PostgreSQL deja en cours d'execution"
        $nets = docker inspect --format "{{json .NetworkSettings.Networks}}" lpmde_db_prod 2>&1
        if ($nets -notmatch "lpmde-net") { docker network connect lpmde-net lpmde_db_prod }
      }
    - docker stop lpmde_prod; docker rm lpmde_prod
    - |
      docker run -d `
        --restart=unless-stopped `
        --network lpmde-net `
        -p 8088:80 `
        -e APP_ENV=prod `
        -e APP_SECRET=$env:APP_SECRET `
        -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
        --name lpmde_prod `
        lpmde:latest
    - |
      Start-Sleep -Seconds 5
      docker exec `
        -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
        lpmde_prod `
        bash -c "cd /var/www/html && php bin/console doctrine:migrations:migrate --no-interaction"
    - |
      docker exec lpmde_prod chown -R www-data:www-data /var/www/html/var
      docker exec -u www-data `
        -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
        lpmde_prod `
        php bin/console cache:warmup --env=prod
    - |
      $maxAttempts = 12; $attempt = 0
      do {
        $attempt++
        Start-Sleep -Seconds 5
        try {
          $response = Invoke-WebRequest -Uri http://localhost:8088/healthy -UseBasicParsing -ErrorAction Stop
          Write-Host "Production OK - HTTP $($response.StatusCode)"; exit 0
        } catch {
          $statusCode = if ($_.Exception.Response) { $_.Exception.Response.StatusCode.value__ } else { "connexion refusee" }
          Write-Host "Tentative $attempt/$maxAttempts - $statusCode - $($_.Exception.Message)"
        }
      } while ($attempt -lt $maxAttempts)
      docker logs --tail 50 lpmde_prod
      docker inspect --format "Statut: {{.State.Status}} | Erreur: {{.State.Error}}" lpmde_prod
      Write-Host "Health check echoue apres $maxAttempts tentatives"; exit 1
