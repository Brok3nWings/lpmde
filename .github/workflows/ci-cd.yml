name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - bryan
  pull_request:
    branches:
      - main
      - master
      - develop
      - bryan

env:
  DOCKER_DRIVER: overlay2

jobs:
  # Stage Install
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Create .env file for CI
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/
          retention-days: 1

  # Stage Test
  sast-npm-audit:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  sonar-audit:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: var/log/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.sources=src
            -Dsonar.php.coverage.reportPaths=var/log/cobertura.xml
        continue-on-error: true

  trivy-fs-audit:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
        continue-on-error: true

  unit-test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for tests
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pcov
          coverage: pcov

      - name: Create log directory
        run: mkdir -p var/log

      - name: Run unit tests with coverage
        run: php bin/phpunit --coverage-cobertura=var/log/cobertura.xml --log-junit=var/log/junit.xml --coverage-text | tee var/log/coverage-summary.txt

      - name: Print coverage summary
        run: grep -E "Classes|Methods|Lines" var/log/coverage-summary.txt || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            var/log/junit.xml
            var/log/cobertura.xml
        continue-on-error: true

  e2e-test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for tests
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Run E2E tests
        run: |
          echo "Running E2E tests"
          php bin/phpunit --testsuite=e2e --no-coverage
        continue-on-error: false

  # Stage Release
  k6-smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "APP_ENV=dev" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/test.db" >> .env
          echo "USER_SERVICE_URL=http://localhost:8001" >> .env
          echo "SUBSCRIPTION_SERVICE_URL=http://localhost:8001" >> .env
          echo "MESSENGER_TRANSPORT_DSN=sync://" >> .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start PHP servers
        run: |
          php -S localhost:8000 -t public &
          php -S localhost:8001 -t public &
          sleep 3
          curl -sf http://localhost:8000/ > /dev/null && echo "Server 8000 OK"
          curl -sf http://localhost:8001/ > /dev/null && echo "Server 8001 OK"

      - name: Run k6 smoke test
        run: k6 run load-tests/smoke-test.js --out json=var/log/k6-results.json
        continue-on-error: true

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: var/log/k6-results.json
        continue-on-error: true

  # Stage Release
  build-image:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test, k6-smoke-test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scan de vulnérabilités sur l'image Docker construite
  trivy-image-scan:
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
        continue-on-error: true

      - name: Upload Trivy image scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
        continue-on-error: true

  # Stage Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: trivy-image-scan
    environment:
      name: staging
      url: https://localhost
    steps:
      - name: Show deployment instructions
        run: |
          echo "========================================"
          echo "  Image Docker disponible sur ghcr.io"
          echo "========================================"
          echo ""
          echo "Pour déployer localement, exécutez :"
          echo ""
          echo "  docker pull ghcr.io/${{ github.repository }}:latest"
          echo ""
          echo "  docker run --rm -p 8088:80 \\" 
          echo "    -e APP_ENV=prod \\"  
          echo "    -e APP_SECRET=<votre_secret> \\"  
          echo "    -e DATABASE_URL=\"sqlite:////var/www/html/var/app.db\" \\"  
          echo "    --name lpmde_staging \\"  
          echo "    ghcr.io/${{ github.repository }}:latest"  
          echo ""
          echo "  Ou avec docker compose :"
          echo "  docker compose pull && docker compose up -d"
          echo ""
          echo "Image: ghcr.io/${{ github.repository }}:latest"
          echo "Commit: ${{ github.sha }}"
          echo "Branche: ${{ github.ref_name }}"

  # Stage Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://localhost:8088
    steps:
      - name: Show production deployment instructions
        run: |
          echo "=========================================="
          echo "  Déploiement en production — Manuel"
          echo "=========================================="
          echo ""
          echo "Commande pour mettre à jour le conteneur en production :"
          echo ""
          echo "  docker pull ghcr.io/${{ github.repository }}:latest"
          echo "  docker stop lpmde_prod || true"
          echo "  docker run -d --restart=unless-stopped -p 80:80 \\"  
          echo "    -e APP_ENV=prod \\"  
          echo "    -e APP_SECRET=<votre_secret> \\"  
          echo "    -e DATABASE_URL=\"sqlite:////var/www/html/var/app.db\" \\"  
          echo "    --name lpmde_prod \\"  
          echo "    ghcr.io/${{ github.repository }}:latest"
          echo ""
          echo "Image: ghcr.io/${{ github.repository }}:latest"
          echo "Commit: ${{ github.sha }}"
