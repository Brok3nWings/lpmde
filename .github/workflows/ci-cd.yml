name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - bryan
  pull_request:
    branches:
      - main
      - master
      - develop
      - bryan

env:
  DOCKER_DRIVER: overlay2

jobs:
  # Stage Install
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Create .env file for CI
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/
          retention-days: 1

  # Stage Test
  sast-npm-audit:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  sonar-audit:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: var/log/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.sources=src
            -Dsonar.php.coverage.reportPaths=var/log/cobertura.xml
        continue-on-error: true

  trivy-fs-audit:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
        continue-on-error: true

  unit-test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for tests
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pcov
          coverage: pcov

      - name: Create log directory
        run: mkdir -p var/log

      - name: Run unit tests with coverage
        run: php bin/phpunit --coverage-cobertura=var/log/cobertura.xml --log-junit=var/log/junit.xml --coverage-text | tee var/log/coverage-summary.txt

      - name: Print coverage summary
        run: grep -E "Classes|Methods|Lines" var/log/coverage-summary.txt || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            var/log/junit.xml
            var/log/cobertura.xml
        continue-on-error: true

  e2e-test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for tests
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Run E2E tests
        run: |
          echo "Running E2E tests"
          php bin/phpunit --testsuite=e2e --no-coverage
        continue-on-error: false

  # Stage Release
  k6-smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "APP_ENV=dev" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/test.db" >> .env
          echo "USER_SERVICE_URL=http://localhost:8001" >> .env
          echo "SUBSCRIPTION_SERVICE_URL=http://localhost:8001" >> .env
          echo "MESSENGER_TRANSPORT_DSN=sync://" >> .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start PHP servers
        run: |
          php -S localhost:8000 -t public &
          php -S localhost:8001 -t public &
          sleep 3
          curl -sf http://localhost:8000/ > /dev/null && echo "Server 8000 OK"
          curl -sf http://localhost:8001/ > /dev/null && echo "Server 8001 OK"

      - name: Run k6 smoke test
        run: k6 run load-tests/smoke-test.js --out json=var/log/k6-results.json
        continue-on-error: true

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: var/log/k6-results.json
        continue-on-error: true

  # Stage Release
  build-image:
    runs-on: self-hosted
    needs: [unit-test, e2e-test, k6-smoke-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image locally
        run: docker build -t lpmde:latest .

  # Scan de vulnérabilités sur l'image Docker construite
  trivy-image-scan:
    runs-on: self-hosted
    needs: build-image
    steps:
      - name: Run Trivy vulnerability scanner on local image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL --exit-code 0 lpmde:latest
        continue-on-error: true

  # Stage Staging
  deploy-staging:
    runs-on: self-hosted
    needs: trivy-image-scan
    environment:
      name: staging
      url: http://localhost:8089
    steps:
      - name: Stop and remove existing staging container
        run: |
          docker stop lpmde_staging
          docker rm lpmde_staging
        continue-on-error: true

      - name: Run staging container
        run: |
          docker run -d `
            --restart=unless-stopped `
            -p 8089:80 `
            -e APP_ENV=prod `
            -e APP_SECRET=${{ secrets.APP_SECRET }} `
            -e DATABASE_URL="sqlite:////var/www/html/var/app.db" `
            --name lpmde_staging `
            lpmde:latest

      - name: Health check staging
        run: |
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri http://localhost:8089 -UseBasicParsing
          if ($response.StatusCode -ne 200) { exit 1 }
          Write-Host "Staging OK — HTTP $($response.StatusCode)"

  # Stage Production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging
    environment:
      name: production
      url: http://localhost:8088
    steps:
      - name: Stop and remove existing container
        run: |
          docker stop lpmde_prod
          docker rm lpmde_prod
        continue-on-error: true

      - name: Run updated container
        run: |
          docker run -d `
            --restart=unless-stopped `
            -p 8088:80 `
            -e APP_ENV=prod `
            -e APP_SECRET=${{ secrets.APP_SECRET }} `
            -e DATABASE_URL="sqlite:////var/www/html/var/app.db" `
            --name lpmde_prod `
            lpmde:latest

      - name: Health check
        run: |
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri http://localhost:8088 -UseBasicParsing
          if ($response.StatusCode -ne 200) { exit 1 }
          Write-Host "Déploiement OK — HTTP $($response.StatusCode)"
