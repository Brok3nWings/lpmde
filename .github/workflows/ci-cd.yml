name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - bryan
  pull_request:
    branches:
      - main
      - master
      - develop
      - bryan

env:
  DOCKER_DRIVER: overlay2

jobs:
  # Stage Install
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Create .env file for CI
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/
          retention-days: 1

  # Stage Test
  sast-npm-audit:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  sonar-audit:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: var/log/
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true

  trivy-fs-audit:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
        continue-on-error: true

  unit-test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for tests
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pcov
          coverage: pcov

      - name: Create log directory
        run: mkdir -p var/log

      - name: Run unit tests with coverage
        run: php bin/phpunit --coverage-clover=var/log/clover.xml --log-junit=var/log/junit.xml --coverage-text | tee var/log/coverage-summary.txt

      - name: Print coverage summary
        run: grep -E "Classes|Methods|Lines" var/log/coverage-summary.txt || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            var/log/junit.xml
            var/log/clover.xml
        continue-on-error: true

  e2e-test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for tests
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test?serverVersion=16" >> .env

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Run E2E tests
        run: |
          echo "Running E2E tests"
          php bin/phpunit --testsuite=e2e --no-coverage
        continue-on-error: false

  # Stage Release
  k6-smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "APP_ENV=dev" > .env
          echo "APP_SECRET=test_secret_for_ci_only" >> .env
          echo "DATABASE_URL=postgresql://app_user:app_password@localhost:5432/app_db?serverVersion=16&charset=utf8" >> .env
          echo "USER_SERVICE_URL=http://localhost:8001" >> .env
          echo "SUBSCRIPTION_SERVICE_URL=http://localhost:8001" >> .env
          echo "MESSENGER_TRANSPORT_DSN=sync://" >> .env
          echo "KEYCLOAK_URL=http://localhost:8080" >> .env
          echo "KEYCLOAK_REALM=master" >> .env
          echo "KEYCLOAK_CLIENT_ID=symfony-app" >> .env
          echo "KEYCLOAK_CLIENT_SECRET=Uc1QgKt5VIjRhqhhe3TpGWCZmUc7oVZk" >> .env
          echo "KEYCLOAK_REDIRECT_URI=http://localhost:8000/login/keycloak/callback" >> .env

      - name: Start Keycloak
        run: |
          docker run -d \
            --name keycloak \
            -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:latest start-dev
          echo "Waiting for Keycloak to be ready..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8080/health/ready > /dev/null 2>&1; then
              echo "Keycloak ready after ${i}x5s"
              break
            fi
            echo "Attempt $i/24..."
            sleep 5
          done
          curl -sf http://localhost:8080/health/ready > /dev/null && echo "Keycloak OK" || echo "Keycloak not ready (continuing)"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Setup database
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console cache:clear --no-warmup

      - name: Start PHP servers and run k6 smoke test
        run: |
          mkdir -p var/log
          php -S localhost:8000 -t public > /tmp/server-8000.log 2>&1 &
          php -S localhost:8001 -t public > /tmp/server-8001.log 2>&1 &
          sleep 5
          curl -sf http://localhost:8000/healthy > /dev/null && echo "Server 8000 OK" || (cat /tmp/server-8000.log; echo "Server 8000 not responding")
          curl -sf http://localhost:8001/healthy > /dev/null && echo "Server 8001 OK" || (cat /tmp/server-8001.log; echo "Server 8001 not responding")
          k6 run load-tests/smoke-test.js --out json=var/log/k6-results.json || true

      - name: Publish k6 metrics to Job Summary
        if: always()
        run: |
          if [ -f var/log/k6-summary.json ]; then
            python3 << 'EOF'
          import json, os
          with open('var/log/k6-summary.json') as f:
              data = json.load(f)
          m = data.get('metrics', {})

          def v(metric, key, default='N/A'):
              try:
                  return m[metric]['values'][key]
              except (KeyError, TypeError):
                  return default

          avg       = v('http_req_duration', 'avg')
          p95       = v('http_req_duration', 'p(95)')
          failed    = v('http_req_failed',   'rate')
          reqs      = v('http_reqs',         'count')
          chk_rate  = v('checks',            'rate')
          chk_pass  = v('checks',            'passes')
          chk_fail  = v('checks',            'fails')

          def ms(val):
              return f"{val:.2f} ms" if isinstance(val, (int, float)) else str(val)
          def pct(val):
              return f"{val*100:.1f}%" if isinstance(val, (int, float)) else str(val)
          def num(val):
              return str(int(val)) if isinstance(val, float) else str(val)

          lines = [
              "## k6 Smoke Test — Métriques\n",
              "| Métrique | Valeur |",
              "|---|---|",
              f"| Requêtes totales | {num(reqs)} |",
              f"| Durée moyenne | {ms(avg)} |",
              f"| Durée p(95) | {ms(p95)} |",
              f"| Taux d'échec HTTP | {pct(failed)} |",
              f"| Checks réussis | {pct(chk_rate)} ({num(chk_pass)} ✓ / {num(chk_fail)} ✗) |",
          ]

          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a') as f:
                  f.write('\n'.join(lines) + '\n')
          else:
              print('\n'.join(lines))
          EOF
          else
            echo "## k6 Smoke Test" >> $GITHUB_STEP_SUMMARY
            echo "Fichier k6-summary.json introuvable — métriques non disponibles" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: |
            var/log/k6-results.json
            var/log/k6-summary.json
        continue-on-error: true

  # Stage Release
  build-image:
    runs-on: self-hosted
    needs: [unit-test, e2e-test, k6-smoke-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image locally
        run: docker build -t lpmde:latest .

  # Scan de vulnérabilités sur l'image Docker construite
  trivy-image-scan:
    runs-on: self-hosted
    needs: build-image
    steps:
      - name: Run Trivy vulnerability scanner on local image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL --exit-code 0 lpmde:latest
        continue-on-error: true

  # Stage Staging
  deploy-staging:
    runs-on: self-hosted
    needs: trivy-image-scan
    environment:
      name: staging
      url: http://localhost:8089
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure lpmde-net network exists
        run: docker network inspect lpmde-net 2>&1 | Out-Null; if ($LASTEXITCODE -ne 0) { docker network create lpmde-net }; Write-Host "Network ready"

      - name: Ensure PostgreSQL container is running
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $running = docker inspect --format "{{.State.Running}}" lpmde_db_prod 2>&1
          if ($running -ne "true") {
            Write-Host "Demarrage du conteneur PostgreSQL..."
            docker rm lpmde_db_prod 2>&1 | Out-Null
            docker run -d `
              --restart=unless-stopped `
              --network lpmde-net `
              --name lpmde_db_prod `
              -e POSTGRES_DB=app_db `
              -e POSTGRES_USER=app_user `
              -e POSTGRES_PASSWORD=app_password `
              -v lpmde_pg_data:/var/lib/postgresql/data `
              postgres:16-alpine
            if ($LASTEXITCODE -ne 0) { Write-Error "docker run failed"; exit 1 }
            Start-Sleep -Seconds 10
          } else {
            Write-Host "PostgreSQL deja en cours d'execution"
            $nets = docker inspect --format "{{json .NetworkSettings.Networks}}" lpmde_db_prod 2>&1
            if ($nets -notmatch "lpmde-net") { docker network connect lpmde-net lpmde_db_prod }
          }

      - name: Ensure Keycloak container is running
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $running = docker inspect --format "{{.State.Running}}" lpmde_keycloak 2>&1
          if ($running -ne "true") {
            Write-Host "Demarrage du conteneur Keycloak..."
            docker rm lpmde_keycloak 2>&1 | Out-Null
            docker run -d `
              --restart=unless-stopped `
              --network lpmde-net `
              --name lpmde_keycloak `
              -p 8080:8080 `
              -e KEYCLOAK_ADMIN=admin `
              -e KEYCLOAK_ADMIN_PASSWORD=admin `
              quay.io/keycloak/keycloak:latest start-dev
            if ($LASTEXITCODE -ne 0) { Write-Error "docker run keycloak failed"; exit 1 }
            Write-Host "Attente demarrage Keycloak (30s)..."
            Start-Sleep -Seconds 30
          } else {
            Write-Host "Keycloak deja en cours d'execution"
            $nets = docker inspect --format "{{json .NetworkSettings.Networks}}" lpmde_keycloak 2>&1
            if ($nets -notmatch "lpmde-net") { docker network connect lpmde-net lpmde_keycloak }
          }

      - name: Configure Keycloak client
        run: |
          for ($i = 1; $i -le 12; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:8080/health/ready" -UseBasicParsing -ErrorAction Stop | Out-Null
              Write-Host "Keycloak pret"
              break
            } catch {
              Write-Host "Attente Keycloak $i/12..."
              Start-Sleep -Seconds 5
            }
          }
          $tokenResp = Invoke-RestMethod -Uri "http://localhost:8080/realms/master/protocol/openid-connect/token" `
            -Method Post -ContentType "application/x-www-form-urlencoded" `
            -Body "grant_type=password&client_id=admin-cli&username=admin&password=admin"
          $token = $tokenResp.access_token
          $clients = Invoke-RestMethod -Uri "http://localhost:8080/admin/realms/master/clients?clientId=symfony-app" `
            -Headers @{Authorization="Bearer $token"}
          if ($clients.Count -eq 0) {
            $body = '{"clientId":"symfony-app","secret":"Uc1QgKt5VIjRhqhhe3TpGWCZmUc7oVZk","enabled":true,"publicClient":false,"redirectUris":["http://localhost:8000/*","http://localhost:8089/*","http://localhost:8088/*"],"postLogoutRedirectUris":["http://localhost:8000/","http://localhost:8089/","http://localhost:8088/"],"webOrigins":["*"],"standardFlowEnabled":true,"directAccessGrantsEnabled":true}'
            Invoke-RestMethod -Uri "http://localhost:8080/admin/realms/master/clients" `
              -Method Post -Headers @{Authorization="Bearer $token";"Content-Type"="application/json"} -Body $body
            Write-Host "Client symfony-app cree"
          } else {
            Write-Host "Client symfony-app deja existant"
          }
        continue-on-error: true

      - name: Stop and remove existing staging container
        run: |
          docker stop lpmde_staging
          docker rm lpmde_staging
        continue-on-error: true

      - name: Run staging container
        run: |
          docker run -d `
            --restart=unless-stopped `
            --network lpmde-net `
            -p 8089:80 `
            -e APP_ENV=prod `
            -e APP_SECRET=${{ secrets.APP_SECRET }} `
            -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
            -e KEYCLOAK_URL="http://localhost:8080" `
            -e KEYCLOAK_INTERNAL_URL="http://lpmde_keycloak:8080" `
            -e KEYCLOAK_REALM=master `
            -e KEYCLOAK_CLIENT_ID=symfony-app `
            -e KEYCLOAK_CLIENT_SECRET=Uc1QgKt5VIjRhqhhe3TpGWCZmUc7oVZk `
            -e KEYCLOAK_REDIRECT_URI="http://localhost:8089/login/keycloak/callback" `
            --name lpmde_staging `
            lpmde:latest

      - name: Run database migrations
        run: |
          Start-Sleep -Seconds 5
          docker exec `
            -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
            lpmde_staging `
            bash -c "cd /var/www/html && php bin/console doctrine:migrations:migrate --no-interaction"

      - name: Seed database with initial data
        run: |
          docker exec `
            -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
            lpmde_staging `
            php bin/console app:db:seed --no-interaction
          Write-Host "Seed termine"
        continue-on-error: true

      - name: Fix cache permissions and warm up
        run: |
          docker exec lpmde_staging chown -R www-data:www-data /var/www/html/var
          docker exec -u www-data `
            -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
            lpmde_staging `
            php bin/console cache:warmup --env=prod

      - name: Health check staging
        run: |
          $maxAttempts = 12
          $attempt = 0
          do {
            $attempt++
            Start-Sleep -Seconds 5
            try {
              $response = Invoke-WebRequest -Uri http://localhost:8089/healthy -UseBasicParsing -ErrorAction Stop
              Write-Host "Staging OK - HTTP $($response.StatusCode)"
              exit 0
            } catch {
              $statusCode = if ($_.Exception.Response) { $_.Exception.Response.StatusCode.value__ } else { "connexion refusee" }
              Write-Host "Tentative $attempt/$maxAttempts - $statusCode - $($_.Exception.Message)"
            }
          } while ($attempt -lt $maxAttempts)
          Write-Host "=== Logs du conteneur staging (50 dernieres lignes) ==="
          docker logs --tail 50 lpmde_staging
          Write-Host "=== Etat du conteneur ==="
          docker inspect --format "Statut: {{.State.Status}} | Erreur: {{.State.Error}}" lpmde_staging
          Write-Host "Health check echoue apres $maxAttempts tentatives"
          exit 1

  # Stage Production
  deploy-production:
    runs-on: self-hosted
    needs: deploy-staging
    environment:
      name: production
      url: http://localhost:8088
    steps:
      - name: Ensure lpmde-net network exists
        run: docker network inspect lpmde-net 2>&1 | Out-Null; if ($LASTEXITCODE -ne 0) { docker network create lpmde-net }; Write-Host "Network ready"

      - name: Ensure PostgreSQL container is running
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $running = docker inspect --format "{{.State.Running}}" lpmde_db_prod 2>&1
          if ($running -ne "true") {
            Write-Host "Demarrage du conteneur PostgreSQL..."
            docker rm lpmde_db_prod 2>&1 | Out-Null
            docker run -d `
              --restart=unless-stopped `
              --network lpmde-net `
              --name lpmde_db_prod `
              -e POSTGRES_DB=app_db `
              -e POSTGRES_USER=app_user `
              -e POSTGRES_PASSWORD=app_password `
              -v lpmde_pg_data:/var/lib/postgresql/data `
              postgres:16-alpine
            if ($LASTEXITCODE -ne 0) { Write-Error "docker run failed"; exit 1 }
            Start-Sleep -Seconds 10
          } else {
            Write-Host "PostgreSQL deja en cours d'execution"
            $nets = docker inspect --format "{{json .NetworkSettings.Networks}}" lpmde_db_prod 2>&1
            if ($nets -notmatch "lpmde-net") { docker network connect lpmde-net lpmde_db_prod }
          }

      - name: Ensure Keycloak container is running
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $running = docker inspect --format "{{.State.Running}}" lpmde_keycloak 2>&1
          if ($running -ne "true") {
            Write-Host "Demarrage du conteneur Keycloak..."
            docker rm lpmde_keycloak 2>&1 | Out-Null
            docker run -d `
              --restart=unless-stopped `
              --network lpmde-net `
              --name lpmde_keycloak `
              -p 8080:8080 `
              -e KEYCLOAK_ADMIN=admin `
              -e KEYCLOAK_ADMIN_PASSWORD=admin `
              quay.io/keycloak/keycloak:latest start-dev
            if ($LASTEXITCODE -ne 0) { Write-Error "docker run keycloak failed"; exit 1 }
            Write-Host "Attente demarrage Keycloak (30s)..."
            Start-Sleep -Seconds 30
          } else {
            Write-Host "Keycloak deja en cours d'execution"
            $nets = docker inspect --format "{{json .NetworkSettings.Networks}}" lpmde_keycloak 2>&1
            if ($nets -notmatch "lpmde-net") { docker network connect lpmde-net lpmde_keycloak }
          }

      - name: Configure Keycloak client
        run: |
          for ($i = 1; $i -le 12; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:8080/health/ready" -UseBasicParsing -ErrorAction Stop | Out-Null
              Write-Host "Keycloak pret"
              break
            } catch {
              Write-Host "Attente Keycloak $i/12..."
              Start-Sleep -Seconds 5
            }
          }
          $tokenResp = Invoke-RestMethod -Uri "http://localhost:8080/realms/master/protocol/openid-connect/token" `
            -Method Post -ContentType "application/x-www-form-urlencoded" `
            -Body "grant_type=password&client_id=admin-cli&username=admin&password=admin"
          $token = $tokenResp.access_token
          $clients = Invoke-RestMethod -Uri "http://localhost:8080/admin/realms/master/clients?clientId=symfony-app" `
            -Headers @{Authorization="Bearer $token"}
          if ($clients.Count -eq 0) {
            $body = '{"clientId":"symfony-app","secret":"Uc1QgKt5VIjRhqhhe3TpGWCZmUc7oVZk","enabled":true,"publicClient":false,"redirectUris":["http://localhost:8000/*","http://localhost:8089/*","http://localhost:8088/*"],"postLogoutRedirectUris":["http://localhost:8000/","http://localhost:8089/","http://localhost:8088/"],"webOrigins":["*"],"standardFlowEnabled":true,"directAccessGrantsEnabled":true}'
            Invoke-RestMethod -Uri "http://localhost:8080/admin/realms/master/clients" `
              -Method Post -Headers @{Authorization="Bearer $token";"Content-Type"="application/json"} -Body $body
            Write-Host "Client symfony-app cree"
          } else {
            Write-Host "Client symfony-app deja existant"
          }
        continue-on-error: true

      - name: Stop and remove existing container
        run: |
          docker stop lpmde_prod
          docker rm lpmde_prod
        continue-on-error: true

      - name: Run updated container
        run: |
          docker run -d `
            --restart=unless-stopped `
            --network lpmde-net `
            -p 8088:80 `
            -e APP_ENV=prod `
            -e APP_SECRET=${{ secrets.APP_SECRET }} `
            -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
            -e KEYCLOAK_URL="http://localhost:8080" `
            -e KEYCLOAK_INTERNAL_URL="http://lpmde_keycloak:8080" `
            -e KEYCLOAK_REALM=master `
            -e KEYCLOAK_CLIENT_ID=symfony-app `
            -e KEYCLOAK_CLIENT_SECRET=Uc1QgKt5VIjRhqhhe3TpGWCZmUc7oVZk `
            -e KEYCLOAK_REDIRECT_URI="http://localhost:8088/login/keycloak/callback" `
            --name lpmde_prod `
            lpmde:latest

      - name: Run database migrations
        run: |
          Start-Sleep -Seconds 5
          docker exec `
            -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
            lpmde_prod `
            bash -c "cd /var/www/html && php bin/console doctrine:migrations:migrate --no-interaction"

      - name: Fix cache permissions and warm up
        run: |
          docker exec lpmde_prod chown -R www-data:www-data /var/www/html/var
          docker exec -u www-data `
            -e DATABASE_URL="postgresql://app_user:app_password@lpmde_db_prod:5432/app_db?serverVersion=16&charset=utf8" `
            lpmde_prod `
            php bin/console cache:warmup --env=prod

      - name: Health check
        run: |
          $maxAttempts = 12
          $attempt = 0
          do {
            $attempt++
            Start-Sleep -Seconds 5
            try {
              $response = Invoke-WebRequest -Uri http://localhost:8088/healthy -UseBasicParsing -ErrorAction Stop
              Write-Host "Production OK - HTTP $($response.StatusCode)"
              exit 0
            } catch {
              $statusCode = if ($_.Exception.Response) { $_.Exception.Response.StatusCode.value__ } else { "connexion refusee" }
              Write-Host "Tentative $attempt/$maxAttempts - $statusCode - $($_.Exception.Message)"
            }
          } while ($attempt -lt $maxAttempts)
          Write-Host "=== Logs du conteneur production (50 dernieres lignes) ==="
          docker logs --tail 50 lpmde_prod
          Write-Host "=== Etat du conteneur ==="
          docker inspect --format "Statut: {{.State.Status}} | Erreur: {{.State.Error}}" lpmde_prod
          Write-Host "Health check echoue apres $maxAttempts tentatives"
          exit 1
