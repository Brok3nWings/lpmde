version: '3.8'

services:
  web:
    image: ${CI_REGISTRY_IMAGE:-lpmde}:${IMAGE_TAG:-latest}
    container_name: lpmde-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-changeme_in_production_with_random_string}
      DATABASE_URL: postgresql://${DB_USER:-lpmde}:${DB_PASSWORD:-lpmde}@database:5432/${DB_NAME:-lpmde}?serverVersion=16&charset=utf8
    volumes:
      - ./var/log:/var/www/html/var/log
    networks:
      - lpmde-network
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: lpmde-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lpmde}
      POSTGRES_USER: ${DB_USER:-lpmde}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lpmde}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - lpmde-network
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lpmde} -d ${DB_NAME:-lpmde}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  lpmde-network:
    driver: bridge

volumes:
  db-data:
